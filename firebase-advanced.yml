name: Advanced Firebase Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Firebase CLI
      run: npm install -g firebase-tools

    - name: Cache node_modules
      uses: actions/cache@v3
      with:
        path: |
          server/functions/node_modules
        key: ${{ runner.os }}-functions-${{ hashFiles('server/functions/package-lock.json') }}

    - name: Install Dependencies
      run: |
        cd server/functions
        npm install

    - name: Set Firebase Project & Deploy
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      run: |
        firebase use --add
        firebase deploy --only hosting,functions --token "$FIREBASE_TOKEN"

    - name: Telegram Deploy Notification
      if: success()
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        curl -s -X POST https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage \
          -d chat_id=$TELEGRAM_CHAT_ID \
          -d text="✅ PlexiShop has been deployed to Firebase successfully!"

